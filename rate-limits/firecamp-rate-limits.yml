description: >-
  HONEST ZERO. Firecamp publishes no rate limits, because Firecamp publishes no consumer
  API to limit — it is a desktop and web API client (a Postman/Insomnia alternative), and
  its only HTTP backend (api.firecamp.dev) is the application's own and has no public
  reference. This file REPLACES a 2026-05-04 API Evangelist scaffold that asserted
  X-RateLimit-* response headers, a 429 exhaustion code, per-tier ceilings of 10/100/1000
  requests per minute and monthly quotas. None of that was ever published by Firecamp; it
  was scaffold default text and is removed rather than carried forward.
limit_count: 0
