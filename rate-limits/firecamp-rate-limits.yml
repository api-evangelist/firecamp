evidence:
- url: https://firecamp.io/pricing
  status: 200
  finding: Seat-banded plans only — no request quota, no rate ceiling, no overage.
- url: https://firecamp.io/docs
  status: 200
  finding: Documentation covers using Firecamp against other people's APIs; no Firecamp API reference and no limits page.
- url: https://api.firecamp.dev/
  status: 404
  finding: Application backend returns 404 to anonymous requests; no public contract to carry limit headers.
