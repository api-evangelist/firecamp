description: >-
  First-party packages published by Firecamp. IMPORTANT SCOPE NOTE: Firecamp publishes no
  public consumer HTTP API, so none of these are client SDKs for a Firecamp API. They are
  internal libraries of the open-source Firecamp monorepo (firecamp-dev/firecamp, AGPL-3.0)
  published to npm under the @firecamp scope. They are recorded here as real, dated,
  first-party distribution evidence — and because their publish dates are the clearest
  currency signal available for this project. No `SDKs` pointer is emitted in apis.yml:
  there is no API for an SDK to wrap, and claiming one would be a false credit.
