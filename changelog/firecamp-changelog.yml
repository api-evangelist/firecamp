  - Theming with primary/secondary color options
  - Authentication modals moved to a side drawer
  - New icon set
- version: v3.0.0
  date: '2023-07-12'
  channel: stable
  url: https://firecamp.io/blog/changelog-001
  breaking: true
  highlights:
  - Complete rewrite as a web-first, multi-protocol platform
  - Dedicated playgrounds per protocol (REST, GraphQL, WebSocket, Socket.IO)
  - Postman compatibility for collections and pre-request/test scripts
  breaking_changes:
  - Firecamp v2 desktop is no longer compatible with v3 collaboration
  - Collection-level and workspace-level environments are no longer supported (old environments are clonable into environment variables)
  - Firecamp v2 scripts are no longer supported; scripts are now Postman-compatible
  migration_guide: https://firecamp.io/blog/changelog-001
