  highlights:
  - Profile, workspace and organization management moved into the app
  - Invitation management and invitation acceptance handled in-app
  - Removed the sub-domain redirect to app.firecamp.dev
- version: v3.1.0
  date: '2023-07-31'
  channel: stable
  url: https://firecamp.io/blog/changelog-002
  breaking: false
