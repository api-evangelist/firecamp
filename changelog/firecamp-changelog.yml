  releases on GitHub. There is no dedicated /changelog page (https://firecamp.io/changelog
  returns 404) and no feed (rss.xml, feed.xml and blog/rss.xml all 404). Both surfaces stop
  in 2023-2024: the newest blog changelog is #004 (2023-10-20) and the newest GitHub release
  is v3.3.0-beta.3 (2024-03-04). This describes the open-source product, not an API — Firecamp
  ships no consumer API and therefore no API version history.
