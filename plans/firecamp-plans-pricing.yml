description: >-
  Firecamp's published plans, read verbatim from https://firecamp.io/pricing on 2026-09-13.
  This file REPLACES a 2026-05-04 API Evangelist scaffold that carried invented request
  quotas and rate ceilings (1,000 req/month free, 100,000 req/month pro, per-request
  overage). Firecamp does not meter API requests at all — it is a seat-priced developer
  tool, not a metered API — so every quota in that scaffold described a billing model the
  provider has never operated. Pricing below is per seat-band and flat-rate.
plan_count: 3
billing:
  unit: seats
  currency: USD
  metered: false
  note: >-
    No usage metering, no request quota and no overage pricing appears anywhere on the
    pricing page. Tiers are bounded by seat count.
plans:
- id: firecamp-free
  name: Free
  type: freemium
  price: '0.00'
  currency: USD
  billingPeriod: month
  seats: 5
  seats_label: upto 5 seats
  description: >-
    Free tier for individuals and small teams, up to 5 seats. Verbatim from the pricing page.
  entries:
  - label: Seats
    name: seats
    type: quota
    metric: seats
    limit: 5
    timeFrame: month
    unit: 1
    price: '0.00'
    userMultiplied: false
  elements:
  - name: API Playgrounds
  - name: API Collaboration
  - name: Unlimited Workspaces
  - name: Unlimited API Collections
  - name: Community Support
- id: firecamp-team
  name: Team
  type: paid
  price: '49.00'
  price_monthly: '59.00'
  currency: USD
  billingPeriod: month
  billing_note: '$49 per month billed yearly, or $59 monthly'
  seats: 15
  seats_label: upto 15 seats
  description: >-
    Paid team tier, up to 15 seats. Listed as "$49 per month billed yearly or $59 monthly".
  entries:
  - label: Seats
    name: seats
    type: quota
    metric: seats
    limit: 15
    timeFrame: month
    unit: 1
    price: '49.00'
    userMultiplied: false
  elements:
  - name: All Free features
  - name: 15 team members
  - name: 24*7 Support on a priority
  - name: Team Management Resources
- id: firecamp-enterprise
  name: Enterprise
  type: enterprise
  price: custom
  currency: USD
  billingPeriod: custom
  seats: null
  description: >-
    "Need more? Contact us for a custom plan for your company." No published price, seat
    band, quota or SLA. The contact path on the pricing page is a Tally form
    (https://tally.so/r/mRxW14).
  entries: []
  elements:
  - name: Custom plan
not_published:
- request quotas
- rate limits per tier
- overage pricing
- contractual SLA terms
- data residency options
