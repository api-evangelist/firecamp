providerId: firecamp
description: >-
  Product lifecycle for Firecamp, the open-source multi-protocol API client. Firecamp
  publishes no consumer API, so there is no API version, no deprecated operation set and no
  API SLA — everything below describes the application and the open-source project. Firecamp
  HAS communicated one real, dated deprecation with a migration path (the Chrome extension,
  effective 2023-10-01) but publishes no standing deprecation POLICY: no sunset window is
  promised, no RFC 8594 Sunset/Deprecation headers exist (there is no HTTP contract to carry
  them), and no support-window commitment is stated anywhere. No `Deprecation` pointer is
  emitted in apis.yml for that reason — one event notice is not a policy, and claiming
  otherwise would credit Firecamp with a commitment it has not made.
